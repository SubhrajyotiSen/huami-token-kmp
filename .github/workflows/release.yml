name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── CLI (Linux runner) ──────────────────────────────────────────
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build CLI
        run: ./kotlin build --module cli

      - name: Package CLI
        run: ./kotlin do packageCli --module cli

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/build/distributions/*.zip

  # ── Desktop macOS (.dmg) ────────────────────────────────────────
  desktop-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build desktop app
        run: ./kotlin build --module desktopApp

      - name: Package desktop app
        run: ./kotlin do packageDesktop --module desktopApp

      - name: Upload macOS DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp/build/packages/*.dmg

  # ── Desktop Windows (.msi) ──────────────────────────────────────
  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build desktop app
        run: ./kotlin.bat build --module desktopApp

      - name: Package desktop app
        run: ./kotlin.bat do packageDesktop --module desktopApp

      - name: Upload Windows MSI to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp\build\packages\*.msi

  # ── Desktop Linux (.deb) ────────────────────────────────────────
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build desktop app
        run: ./kotlin build --module desktopApp

      - name: Package desktop app
        run: ./kotlin do packageDesktop --module desktopApp

      - name: Upload Linux Deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp/build/packages/*.deb