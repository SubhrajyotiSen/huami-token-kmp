name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── CLI (Linux runner) ──────────────────────────────────────────
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CLI distribution
        run: ./gradlew :cli:distZip --no-daemon

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/build/distributions/cli.zip

  # ── Desktop macOS (.dmg) ────────────────────────────────────────
  desktop-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build macOS distribution
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon

      - name: Upload macOS DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp/build/compose/binaries/main-release/dmg/*.dmg

  # ── Desktop Windows (.msi) ──────────────────────────────────────
  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Windows distribution
        run: ./gradlew :desktopApp:packageReleaseMsi --no-daemon

      - name: Upload Windows MSI to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp\build\compose\binaries\main-release\msi\*.msi

  # ── Desktop Linux (.deb) ────────────────────────────────────────
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Linux distribution
        run: ./gradlew :desktopApp:packageReleaseDeb --no-daemon

      - name: Upload Linux Deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp/build/compose/binaries/main-release/deb/*.deb